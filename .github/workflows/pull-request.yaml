name: Pull Request CI

on:
  pull_request:
    branches:
      - main

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Typecheck Workers tests
        run: pnpm typecheck:workers

      - name: Run Node tests
        run: pnpm test:run

      - name: Run Workers tests
        run: pnpm test:workers

      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --minify
